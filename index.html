<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>大咖原料仓综合计算器</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:system-ui; background:#f4f6f8; padding:16px; max-width:400px; margin:auto}
    .card{background:white; border-radius:12px; padding:16px; box-shadow:0 2px 8px #0001}
    h2{text-align:center; margin:0 0 12px; font-size:18px}
    .label{font-size:14px; color:#555; margin:8px 0 4px}
    .label .required{color:#ff3b30}
    .input-group{display:flex; align-items:center; gap:8px; margin-bottom:8px}
    input, select{flex:1; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:16px}
    select{flex:0 0 75px; background:#f8f9fa}
    .btn{width:100%; padding:12px; background:#007aff; color:white; border:none; border-radius:8px; margin:8px 0; font-size:16px; cursor:pointer}
    .btn-export{background:#5856d6}
    .btn-clear{background:#9ca3af;margin-top:0!important}
    .res{margin-top:12px; padding:12px; background:#eef7ff; border-radius:8px; line-height:1.6; font-size:14px}
    .summary-box{margin-top:10px; padding:10px; background:#fff3cd; border:2px solid #ffc107; border-radius:8px; color:#856404; font-weight:bold; font-size:14px}
    .tab-wrap{display:flex; margin-bottom:12px; border-radius:8px; overflow:hidden; border:1px solid #ddd}
    .tab{flex:1; padding:8px; text-align:center; cursor:pointer; background:#f1f1f1; font-size:13px}
    .tab.active{background:#007aff; color:white}
    .tab-content{display:none}.tab-content.active{display:block}
    .zero-item{display:flex; gap:6px; margin:6px 0}
    .del{background:#ff3b30;color:white;border:none;border-radius:6px;padding:0 8px;cursor:pointer}
    .add-line{background:#34c759;color:white;border:none;border-radius:8px;padding:6px;width:100%;margin:6px 0;cursor:pointer}
    .history-item{font-size:12px; border-bottom:1px solid #eee; padding:10px 0}
    .history-item:first-child{border-top:1px solid #eee}
    .result-card{padding:10px 12px; border-radius:8px; margin:8px 0; font-size:13px}
    .result-card.blue{background:#dbeafe; border-left:4px solid #007aff}
    .result-card.green{background:#dcfce7; border-left:4px solid #22c55e}
    .result-card.orange{background:#ffedd5; border-left:4px solid #f97316}
    .result-card.purple{background:#f3e8ff; border-left:4px solid #a855f7}
    .result-num{font-size:20px; font-weight:bold}
    .search-bar{display:flex; gap:8px; margin-bottom:10px}
    .search-bar input{flex:1}
    .filter-bar{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap}
    .filter-btn{padding:6px 12px; background:#f1f1f1; border:1px solid #ddd; border-radius:6px; cursor:pointer; font-size:12px}
    .filter-btn.active{background:#007aff; color:white; border-color:#007aff}
    .history-tags{margin:6px 0}
    .tag{padding:2px 8px; border-radius:10px; font-size:11px; margin-right:4px; display:inline-block}
    .tag-customer{background:#ffedd5; color:#c2410c}
    .tag-label{background:#dbeafe; color:#1d4ed8}
    .history-expand{cursor:pointer; color:#007aff; font-size:11px; margin:6px 0}
    .history-params{background:#f5f5f5; padding:8px; border-radius:6px; font-size:11px; margin:6px 0; display:none}
    .history-params.show{display:block}
    .param-row{display:flex; justify-content:space-between; padding:2px 0}
    .history-actions{margin:8px 0; display:flex; gap:6px; flex-wrap:wrap}
    .history-btn{padding:5px 10px; border:none; border-radius:6px; cursor:pointer; font-size:11px}
    .history-btn.backfill{background:#007aff; color:white}
    .history-btn.delete{background:#ff3b30; color:white}
    .note-input{width:100%; padding:6px; border:1px solid #ddd; border-radius:6px; font-size:12px; margin-top:6px}
    .modal{position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; display:none}
    .modal.show{display:flex}
    .modal-content{background:white; padding:20px; border-radius:12px; width:90%; max-width:320px}
    .modal-title{font-size:16px; font-weight:bold; margin-bottom:12px}
    .modal-input{width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; margin-bottom:12px}
    .modal-actions{display:flex; gap:10px}
    .modal-btn{flex:1; padding:10px; border:none; border-radius:8px; cursor:pointer}
    .modal-btn.cancel{background:#f1f1f1}
    .modal-btn.confirm{background:#007aff; color:white}
    .empty-state{text-align:center; padding:30px; color:#999}
    .save-feedback{color:#22c55e; font-size:12px; margin-left:8px; opacity:0; transition:opacity 0.3s}
    .save-feedback.show{opacity:1}
  </style>
</head>
<body>
  <div class="card">
    <h2>大咖原料仓计算器</h2>
    
    <div class="tab-wrap">
      <div class="tab active" data-target="outStock">出库</div>
      <div class="tab" data-target="splitCalc">拆零</div>
      <div class="tab" data-target="arrivalCalc">到货</div>
      <div class="tab" data-target="historyTab">记录</div>
    </div>

    <div id="outStock" class="tab-content active">
      <div class="label">每箱重量 (kg)</div>
      <input id="perBox" type="number" inputmode="decimal" min="0" placeholder="20">
      
      <div class="label">需求总量</div>
      <div class="input-group">
        <input id="needVal" type="number" inputmode="decimal" min="0">
        <select id="needUnit">
          <option value="box">箱</option>
          <option value="kg">kg</option>
        </select>
      </div>
      
      <div class="label">每托重量 (kg)</div>
      <input id="perPalletVal" type="number" inputmode="decimal" min="0">
      
      <div class="label">已出库重量 (kg)</div>
      <input id="outedVal" type="number" inputmode="decimal" min="0" value="0">
      
      <div class="label">现有零托列表 (kg)</div>
      <div id="zeroList">
        <div class="zero-item">
          <input class="zero-input" type="number" inputmode="decimal" min="0">
          <button class="del" onclick="delLine(this)">×</button>
        </div>
      </div>
      <button class="add-line" onclick="addZeroLine()">+ 增加零托</button>
      
      <button class="btn" onclick="calcOutStock()">计算并保存</button>
      <button class="btn btn-clear" onclick="clearOutStock()">🗑️ 清空输入</button>
      <div id="resultStock"></div>
    </div>

    <div id="splitCalc" class="tab-content">
      <div class="label">顾客需求</div>
      <div class="input-group">
        <input id="splitNeedVal" type="number" inputmode="decimal" min="0">
        <select id="splitNeedUnit">
          <option value="kg">kg</option>
          <option value="box">箱</option>
        </select>
      </div>
      
      <div class="label">托盘总重</div>
      <div class="input-group">
        <input id="splitTotalVal" type="number" inputmode="decimal" min="0">
        <select id="splitTotalUnit">
          <option value="kg">kg</option>
          <option value="box">箱</option>
        </select>
      </div>
      
      <div class="label">每箱重量</div>
      <input id="splitPerBox" type="number" inputmode="decimal" min="0" placeholder="20">
      
      <button class="btn" onclick="calcSplit()">计算并保存</button>
      <button class="btn btn-clear" onclick="clearSplit()">🗑️ 清空输入</button>
      <div id="resultSplit"></div>
    </div>

    <div id="arrivalCalc" class="tab-content">
      <!-- 已调整：必填三项移到最前面 -->
      <div class="label"><span class="required">* </span>总重量 (kg)</div>
      <input id="totalWeight" type="number" inputmode="decimal" min="0" placeholder="请输入总重量">
      
      <div class="label"><span class="required">* </span>每箱重量 (kg)</div>
      <input id="boxWeight" type="number" inputmode="decimal" min="0" placeholder="请输入每箱重量">
      
      <div class="label"><span class="required">* </span>每托箱数</div>
      <input id="boxesPerPallet" type="number" inputmode="decimal" min="0" placeholder="请输入每托箱数">

      <div class="label">实物品名</div>
      <input id="itemName" type="text" placeholder="请输入实物品名（可选）">
      
      <div class="label">实物批号</div>
      <input id="batchNo" type="text" placeholder="请输入实物批号（可选）">
      
      <div class="label">实物厂家</div>
      <input id="manufacturer" type="text" placeholder="请输入实物厂家（可选）">
      
      <button class="btn" onclick="calcArrival()">计算并保存</button>
      <button class="btn btn-clear" onclick="clearArrival()">🗑️ 清空输入</button>
      <div id="resultArrival"></div>
    </div>

    <div id="historyTab" class="tab-content">
      <div class="search-bar">
        <input id="searchInput" type="text" placeholder="搜索备注/客户/标签..." oninput="renderHistory()">
      </div>
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">全部</button>
        <button class="filter-btn" data-filter="outStock" onclick="setFilter('outStock')">出库</button>
        <button class="filter-btn" data-filter="splitCalc" onclick="setFilter('splitCalc')">拆零</button>
        <button class="filter-btn" data-filter="arrivalCalc" onclick="setFilter('arrivalCalc')">到货</button>
      </div>
      <button class="btn btn-export" onclick="exportCSV()">📥 导出 CSV</button>
      <div id="historyList"></div>
      <button class="btn" style="background:#ff3b30" onclick="clearHistory()">🗑️ 清空所有记录</button>
    </div>
  </div>

  <div class="modal" id="tagModal">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">添加标签</div>
      <input type="text" class="modal-input" id="modalInput" placeholder="输入后回车确认">
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeModal()">取消</button>
        <button class="modal-btn confirm" onclick="confirmModal()">确定</button>
      </div>
    </div>
  </div>

<script>
  let currentFilter = 'all';
  let modalTarget = null;
  let modalRecordIndex = null;

  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick=function(){
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
      this.classList.add('active');
      document.getElementById(this.dataset.target).classList.add('active');
      if(this.dataset.target==='historyTab') renderHistory();
    }
  });

  function addZeroLine(){
    let d=document.createElement('div');
    d.className='zero-item';
    d.innerHTML='<input class="zero-input" type="number" inputmode="decimal" min="0"><button class="del" onclick="delLine(this)">×</button>';
    document.getElementById('zeroList').appendChild(d);
  }

  function delLine(btn){
    if(document.querySelectorAll('.zero-item').length>1) btn.parentElement.remove()
  }

  function clearOutStock(){
    document.getElementById('perBox').value = '';
    document.getElementById('needVal').value = '';
    document.getElementById('needUnit').value = 'box';
    document.getElementById('perPalletVal').value = '';
    document.getElementById('outedVal').value = '0';
    document.getElementById('zeroList').innerHTML = '<div class="zero-item"><input class="zero-input" type="number" inputmode="decimal" min="0"><button class="del" onclick="delLine(this)">×</button></div>';
    document.getElementById('resultStock').innerHTML = '';
  }

  function clearSplit(){
    document.getElementById('splitNeedVal').value = '';
    document.getElementById('splitNeedUnit').value = 'kg';
    document.getElementById('splitTotalVal').value = '';
    document.getElementById('splitTotalUnit').value = 'kg';
    document.getElementById('splitPerBox').value = '';
    document.getElementById('resultSplit').innerHTML = '';
  }

  function clearArrival(){
    document.getElementById('itemName').value = '';
    document.getElementById('batchNo').value = '';
    document.getElementById('totalWeight').value = '';
    document.getElementById('manufacturer').value = '';
    document.getElementById('boxWeight').value = '';
    document.getElementById('boxesPerPallet').value = '';
    document.getElementById('resultArrival').innerHTML = '';
  }

  function getHistory(){
    let data = localStorage.getItem('myHistory');
    if(!data) return [];
    return JSON.parse(data).map(h => ({
      ...h,
      tags: h.tags || [],
      customer: h.customer || '',
      params: h.params || null
    }));
  }

  function saveHistory(history){
    localStorage.setItem('myHistory', JSON.stringify(history.slice(0, 100)));
  }

  function saveRecord(res, type, params){
    let history = getHistory();
    history.unshift({
      time: new Date().toLocaleString('zh-CN'),
      timestamp: Date.now(),
      type: type,
      result: res,
      tags: [],
      customer: '',
      params: params,
      note: ''
    });
    saveHistory(history);
  }

  function showSaveFeedback(){
    let feedback = document.createElement('span');
    feedback.className = 'save-feedback show';
    feedback.textContent = '✓ 已保存';
    document.querySelector('.tab.active').parentElement.appendChild(feedback);
    setTimeout(()=>feedback.remove(), 2000);
  }

  // 生成所有零托子集（保留索引信息）
  function getZeroSubsets(zeroList) {
    let subsets = [];
    let n = zeroList.length;
    for (let mask = 0; mask < (1 << n); mask++) {
      let sum = 0;
      let indices = [];
      for (let i = 0; i < n; i++) {
        if (mask & (1 << i)) {
          sum += zeroList[i];
          indices.push(i);
        }
      }
      subsets.push({ sum, indices });
    }
    return subsets;
  }

  // 计算最优解
  function findOptimalSolution(still, zeroList, perT, pBox) {
    let validZeros = zeroList.filter(z => z > 0);
    let subsets = getZeroSubsets(validZeros);
    let solutions = [];
    
    // 对于每个零托子集
    subsets.forEach(subset => {
      let zeroSum = subset.sum;
      let remaining = still - zeroSum;
      
      // 情况1：仅用零托子集
      if (zeroSum > 0) {
        solutions.push({
          zeroSum,
          zeroIndices: subset.indices,
          fullPallets: 0,
          splitPallet: 0,
          total: zeroSum,
          diff: Math.abs(zeroSum - still)
        });
      }
      
      // 考虑所有可能的整托数量（从0到合理的上限）
      let maxFull = Math.ceil((still + perT * 2) / perT); // 考虑比需求多一些的情况
      for (let fullNum = 0; fullNum <= maxFull; fullNum++) {
        let totalFull = zeroSum + fullNum * perT;
        
        // 情况2：零托 + fullNum 整托（不拆分）
        solutions.push({
          zeroSum,
          zeroIndices: subset.indices,
          fullPallets: fullNum,
          splitPallet: 0,
          total: totalFull,
          diff: Math.abs(totalFull - still)
        });
        
        // 情况3：零托 + fullNum 整托 + 拆分一托（如果还需要更多）
        if (fullNum >= 0) {
          let remainingAfterFull = still - (zeroSum + fullNum * perT);
          if (remainingAfterFull > 0) {
            let needBoxes = Math.ceil(remainingAfterFull / pBox);
            let splitGive = needBoxes * pBox;
            if (splitGive <= perT) { // 不能拆分超过一整托
              let totalWithSplit = zeroSum + fullNum * perT + splitGive;
              solutions.push({
                zeroSum,
                zeroIndices: subset.indices,
                fullPallets: fullNum,
                splitPallet: splitGive,
                total: totalWithSplit,
                diff: Math.abs(totalWithSplit - still)
              });
            }
          }
        }
      }
    });
    
    // 排序：按差异从小到大
    // 差异相同时：优先选择使用零托的方案（消耗零托）
    // 都使用零托时：优先选择整托数少的
    solutions.sort((a, b) => {
      if (a.diff !== b.diff) return a.diff - b.diff;
      
      // 差异相同，优先选择使用零托的方案
      if (a.zeroSum > 0 && b.zeroSum === 0) return -1;
      if (a.zeroSum === 0 && b.zeroSum > 0) return 1;
      
      // 都使用或都不使用零托，优先选择整托数少的
      if (a.fullPallets !== b.fullPallets) return a.fullPallets - b.fullPallets;
      
      // 都相同，优先选择不拆分的
      if (a.splitPallet === 0 && b.splitPallet > 0) return -1;
      if (a.splitPallet > 0 && b.splitPallet === 0) return 1;
      
      // 最后按总重量
      return a.total - b.total;
    });
    
    // 去重（保留最优的）
    let seen = new Set();
    let uniqueSolutions = [];
    for (let sol of solutions) {
      let key = `${sol.zeroSum}-${sol.fullPallets}-${sol.splitPallet}`;
      if (!seen.has(key)) {
        seen.add(key);
        uniqueSolutions.push(sol);
      }
      if (uniqueSolutions.length >= 3) break; // 只保留前3个最优解
    }
    
    return uniqueSolutions;
  }

  function calcOutStock(){
    let pBox = Number(document.getElementById('perBox').value)||0;
    if(!pBox){alert('请填写每箱重量');return;}
    let needVal = Number(document.getElementById('needVal').value)||0;
    let needUnit = document.getElementById('needUnit').value;
    let totalNeed = needUnit === 'box' ? needVal * pBox : needVal;
    
    let perT = Number(document.getElementById('perPalletVal').value)||0;
    if(!perT){alert('请填写每托重量');return;}
    
    let outedVal = Number(document.getElementById('outedVal').value)||0;
    let zeroInputs = document.querySelectorAll('.zero-input');
    let zeroList = Array.from(zeroInputs).map(i => Number(i.value)||0);
    
    let still = Math.max(totalNeed - outedVal, 0);
    let validZeros = zeroList.filter(z => z > 0);
    
    let solutions = findOptimalSolution(still, validZeros, perT, pBox);
    
    let params = { pBox, needVal, needUnit, perT, outedVal, zeroList };
    
    let html = '';
    
    // 显示最优解
    solutions.forEach((sol, idx) => {
      let isBest = idx === 0;
      let cardClass = isBest ? 'green' : 'blue';
      let titleClass = isBest ? '⭐ 最优方案' : `方案 ${idx + 1}`;
      
      html += `<div class="result-card ${cardClass}">`;
      html += `<div><strong>${titleClass}</strong></div>`;
      
      if (sol.zeroSum > 0) {
        let zeroVals = sol.zeroIndices.map(i => validZeros[i].toFixed(0));
        html += `<div>🔵 零托: ${zeroVals.join(' + ')} = ${sol.zeroSum.toFixed(0)} kg</div>`;
      }
      
      if (sol.fullPallets > 0) {
        html += `<div>🟢 整托: ${sol.fullPallets} 托 × ${perT.toFixed(0)} kg = ${(sol.fullPallets * perT).toFixed(0)} kg</div>`;
      }
      
      if (sol.splitPallet > 0) {
        let giveBoxes = Math.round(sol.splitPallet / pBox);
        let remainKg = perT - sol.splitPallet;
        html += `<div>🟠 拆分: 给 ${sol.splitPallet.toFixed(0)} kg（${giveBoxes} 箱），留 ${remainKg.toFixed(0)} kg</div>`;
      }
      
      let diffDesc = '';
      if (sol.total < still) {
        diffDesc = `少 ${(still - sol.total).toFixed(0)} kg`;
      } else if (sol.total > still) {
        diffDesc = `多 ${(sol.total - still).toFixed(0)} kg`;
      } else {
        diffDesc = '刚好！';
      }
      
      html += `<div style="margin-top:8px;font-weight:bold">总计: <span class="result-num">${sol.total.toFixed(0)}</span> kg | 差异: ${diffDesc}</div>`;
      html += `</div>`;
    });
    
    // 显示原始需求信息
    html += `<div class="summary-box">
      需求: <span class="result-num">${still.toFixed(0)}</span> kg
      ${outedVal > 0 ? ` (已出库 ${outedVal.toFixed(0)} kg)` : ''}
    </div>`;
    
    document.getElementById('resultStock').innerHTML = html;
    saveRecord(html, 'outStock', params);
    showSaveFeedback();
  }

  function calcSplit(){
    let pBox = Number(document.getElementById('splitPerBox').value)||0;
    if(!pBox){alert('请填写每箱重量'); return;}
    let nVal = Number(document.getElementById('splitNeedVal').value)||0;
    let nUnit = document.getElementById('splitNeedUnit').value;
    let nKg = nUnit === 'box' ? nVal * pBox : nVal;
    
    let tVal = Number(document.getElementById('splitTotalVal').value)||0;
    let tUnit = document.getElementById('splitTotalUnit').value;
    let tKg = tUnit === 'box' ? tVal * pBox : tVal;
    
    let params = { pBox, needVal: nVal, needUnit: nUnit, totalVal: tVal, totalUnit: tUnit };
    
    let html = `<div class="result-card purple">
      <div><strong>🔵 出库</strong></div>
      <span class="result-num">${nKg.toFixed(2)}</span> kg / ${Math.floor(nKg/pBox)} 箱 + ${(nKg%pBox).toFixed(2)} kg
    </div>
    <div class="result-card green">
      <div><strong>🟢 留存</strong></div>
      <span class="result-num">${(tKg-nKg).toFixed(2)}</span> kg / ${Math.floor((tKg-nKg)/pBox)} 箱 + ${((tKg-nKg)%pBox).toFixed(2)} kg
    </div>`;
    
    document.getElementById('resultSplit').innerHTML = html;
    saveRecord(html, 'splitCalc', params);
    showSaveFeedback();
  }

  function calcArrival(){
    let totalWeight = Number(document.getElementById('totalWeight').value)||0;
    if(!totalWeight){alert('请填写总重量');return;}
    
    let boxWeight = Number(document.getElementById('boxWeight').value)||0;
    if(!boxWeight){alert('请填写每箱重量');return;}
    
    let boxesPerPallet = Number(document.getElementById('boxesPerPallet').value)||0;
    if(!boxesPerPallet){alert('请填写每托箱数');return;}
    
    let itemName = document.getElementById('itemName').value||'';
    let batchNo = document.getElementById('batchNo').value||'';
    let manufacturer = document.getElementById('manufacturer').value||'';
    
    let totalBoxWeight = boxWeight * boxesPerPallet;
    let fullPallets = Math.floor(totalWeight / totalBoxWeight);
    let remainingWeight = totalWeight % totalBoxWeight;
    let fullBoxes = Math.floor(remainingWeight / boxWeight);
    let looseWeight = remainingWeight % boxWeight;
    
    let params = { itemName, batchNo, totalWeight, manufacturer, boxWeight, boxesPerPallet };
    
    let html = '';
    
    if(itemName || batchNo || manufacturer){
      html += `<div style="background:#f8fafc;padding:10px;border-radius:8px;margin-bottom:10px;font-size:13px">`;
      if(itemName) html += `<div><strong>品名:</strong> ${itemName}</div>`;
      if(batchNo) html += `<div><strong>批号:</strong> ${batchNo}</div>`;
      if(manufacturer) html += `<div><strong>厂家:</strong> ${manufacturer}</div>`;
      html += `</div>`;
    }
    
    html += `<div class="result-card purple">
      <div><strong>📦 到货统计</strong></div>
      总重量：<span class="result-num">${totalWeight.toFixed(2)}</span> kg<br>
      每托：<span class="result-num">${boxesPerPallet}</span> 箱 × <span class="result-num">${boxWeight.toFixed(2)}</span> kg = <span class="result-num">${totalBoxWeight.toFixed(2)}</span> kg
    </div>`;
    
    html += `<div class="result-card green">
      <div><strong>🟢 结果</strong></div>
      整托：<span class="result-num">${fullPallets}</span> 托<br>
      零箱：<span class="result-num">${fullBoxes}</span> 箱
      ${looseWeight > 0 ? `<br>散重：<span class="result-num">${looseWeight.toFixed(2)}</span> kg` : ''}
    </div>`;
    
    if(remainingWeight > 0){
      html += `<div class="summary-box">
        汇总：<span class="result-num">${fullPallets}</span> 托
        ${fullBoxes > 0 ? `+ <span class="result-num">${fullBoxes}</span> 箱` : ''}
        ${looseWeight > 0 ? `+ <span class="result-num">${looseWeight.toFixed(2)}</span> kg散重` : ''}
      </div>`;
    }
    
    document.getElementById('resultArrival').innerHTML = html;
    saveRecord(html, 'arrivalCalc', params);
    showSaveFeedback();
  }

  function renderHistory(){
    let history = getHistory();
    let searchText = document.getElementById('searchInput').value.toLowerCase();
    
    let filtered = history.filter(h => {
      if(currentFilter !== 'all' && h.type !== currentFilter) return false;
      if(!searchText) return true;
      let searchContent = [
        h.note || '',
        h.customer || '',
        h.tags ? h.tags.join(' ') : '',
        h.result || ''
      ].join(' ').toLowerCase();
      return searchContent.includes(searchText);
    });
    
    let list = document.getElementById('historyList');
    
    if(filtered.length === 0){
      list.innerHTML = '<div class="empty-state">暂无记录</div>';
      return;
    }
    
    let typeNames = { outStock: '出库', splitCalc: '拆零', arrivalCalc: '到货' };
    
    list.innerHTML = filtered.map((h, i) => {
      let realIndex = history.indexOf(h);
      let tagsHtml = h.tags.map(t => `<span class="tag tag-label">${t}<span style="cursor:pointer;margin-left:3px" onclick="removeTag(${realIndex},'${t}')">×</span></span>`).join('');
      let customerHtml = h.customer ? `<span class="tag tag-customer">🏷️ ${h.customer}</span>` : '';
      
      let paramsHtml = '';
      if(h.params){
        if(h.type === 'outStock'){
          let p = h.params;
          paramsHtml = `<div class="history-params">
            <div class="param-row"><span>每箱重量</span><span>${p.pBox} kg</span></div>
            <div class="param-row"><span>需求</span><span>${p.needVal} ${p.needUnit === 'box' ? '箱' : 'kg'}</span></div>
            <div class="param-row"><span>每托重量</span><span>${p.perT} kg</span></div>
            <div class="param-row"><span>已出库</span><span>${p.outedVal} kg</span></div>
            <div class="param-row"><span>零托列表</span><span>${p.zeroList.filter(z=>z>0).join(', ') || '无'} kg</span></div>
          </div>`;
        } else if(h.type === 'splitCalc'){
          let p = h.params;
          paramsHtml = `<div class="history-params">
            <div class="param-row"><span>每箱重量</span><span>${p.pBox} kg</span></div>
            <div class="param-row"><span>顾客需求</span><span>${p.needVal} ${p.needUnit === 'box' ? '箱' : 'kg'}</span></div>
            <div class="param-row"><span>托盘总重</span><span>${p.totalVal} ${p.totalUnit === 'box' ? '箱' : 'kg'}</span></div>
          </div>`;
        } else if(h.type === 'arrivalCalc'){
          let p = h.params;
          paramsHtml = `<div class="history-params">`;
          if(p.itemName) paramsHtml += `<div class="param-row"><span>品名</span><span>${p.itemName}</span></div>`;
          if(p.batchNo) paramsHtml += `<div class="param-row"><span>批号</span><span>${p.batchNo}</span></div>`;
          paramsHtml += `<div class="param-row"><span>总重量</span><span>${p.totalWeight} kg</span></div>`;
          if(p.manufacturer) paramsHtml += `<div class="param-row"><span>厂家</span><span>${p.manufacturer}</span></div>`;
          paramsHtml += `<div class="param-row"><span>每箱重量</span><span>${p.boxWeight} kg</span></div>`;
          paramsHtml += `<div class="param-row"><span>每托箱数</span><span>${p.boxesPerPallet}</span></div>`;
          paramsHtml += `</div>`;
        }
      }
      
      return `<div class="history-item">
        <div><strong>${h.time}</strong> <span style="background:#007aff;color:white;padding:1px 6px;border-radius:4px;font-size:10px">${typeNames[h.type]}</span></div>
        ${h.tags.length || h.customer ? `<div class="history-tags">${customerHtml}${tagsHtml}</div>` : ''}
        <div>${h.result}</div>
        ${paramsHtml ? `<div class="history-expand" onclick="toggleParams(this)">▸ 查看输入参数</div>` : ''}
        ${paramsHtml}
        <div class="history-actions">
          <button class="history-btn" style="background:#e5e5e5" onclick="openModal('customer', ${realIndex})">🏷️ 客户</button>
          <button class="history-btn" style="background:#e5e5e5" onclick="openModal('tag', ${realIndex})">📌 标签</button>
          <button class="history-btn backfill" onclick="backfillRecord(${realIndex})">🔄 回填</button>
          <button class="history-btn delete" onclick="deleteRecord(${realIndex})">🗑️ 删除</button>
        </div>
        <input type="text" class="note-input" placeholder="添加备注..." value="${h.note || ''}" onchange="updateNote(${realIndex}, this.value)">
      </div>`;
    }).join('');
  }

  function toggleParams(el){
    let params = el.nextElementSibling;
    if(params && params.classList.contains('history-params')){
      params.classList.toggle('show');
      el.textContent = params.classList.contains('show') ? '▾ 收起参数' : '▸ 查看输入参数';
    }
  }

  function setFilter(type){
    currentFilter = type;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.filter-btn[data-filter="${type}"]`).classList.add('active');
    renderHistory();
  }

  function openModal(target, index){
    modalTarget = target;
    modalRecordIndex = index;
    let modal = document.getElementById('tagModal');
    let input = document.getElementById('modalInput');
    let title = document.getElementById('modalTitle');
    
    if(target === 'customer'){
      title.textContent = '🏷️ 添加客户名称';
      let history = getHistory();
      input.value = history[index].customer || '';
    } else {
      title.textContent = '📌 添加标签（逗号分隔多个）';
      input.value = '';
    }
    
    modal.classList.add('show');
    input.focus();
  }

  function closeModal(){
    document.getElementById('tagModal').classList.remove('show');
    modalTarget = null;
    modalRecordIndex = null;
  }

  function confirmModal(){
    let value = document.getElementById('modalInput').value.trim();
    if(!value) { closeModal(); return; }
    
    let history = getHistory();
    let record = history[modalRecordIndex];
    
    if(modalTarget === 'customer'){
      record.customer = value;
    } else {
      let newTags = value.split(/[,，]/).map(t => t.trim()).filter(t => t);
      record.tags = [...new Set([...record.tags, ...newTags])];
    }
    
    saveHistory(history);
    closeModal();
    renderHistory();
  }

  document.getElementById('modalInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') confirmModal();
    if(e.key === 'Escape') closeModal();
  });

  function removeTag(index, tag){
    let history = getHistory();
    history[index].tags = history[index].tags.filter(t => t !== tag);
    saveHistory(history);
    renderHistory();
  }

  function updateNote(index, value){
    let history = getHistory();
    history[index].note = value;
    saveHistory(history);
  }

  function deleteRecord(index){
    if(!confirm('确定删除此记录？')) return;
    let history = getHistory();
    history.splice(index, 1);
    saveHistory(history);
    renderHistory();
  }

  function clearHistory(){
    if(confirm('确定清空所有记录吗？此操作不可恢复！')) {
      localStorage.removeItem('myHistory');
      renderHistory();
    }
  }

  function backfillRecord(index){
    let history = getHistory();
    let record = history[index];
    
    if(record.type === 'outStock' && record.params){
      let p = record.params;
      document.getElementById('perBox').value = p.pBox;
      document.getElementById('needVal').value = p.needVal;
      document.getElementById('needUnit').value = p.needUnit;
      document.getElementById('perPalletVal').value = p.perT;
      document.getElementById('outedVal').value = p.outedVal;
      
      let zeroList = document.getElementById('zeroList');
      zeroList.innerHTML = '';
      p.zeroList.forEach((val, i) => {
        let div = document.createElement('div');
        div.className = 'zero-item';
        div.innerHTML = `<input class="zero-input" type="number" value="${val}"><button class="del" onclick="delLine(this)">×</button>`;
        zeroList.appendChild(div);
      });
      if(p.zeroList.length === 0 || p.zeroList.every(z => z === 0)){
        addZeroLine();
      }
      
      document.querySelector('[data-target="outStock"]').click();
      document.getElementById('resultStock').innerHTML = '';
      
    } else if(record.type === 'splitCalc' && record.params){
      let p = record.params;
      document.getElementById('splitPerBox').value = p.pBox;
      document.getElementById('splitNeedVal').value = p.needVal;
      document.getElementById('splitNeedUnit').value = p.needUnit;
      document.getElementById('splitTotalVal').value = p.totalVal;
      document.getElementById('splitTotalUnit').value = p.totalUnit;
      
      document.querySelector('[data-target="splitCalc"]').click();
      document.getElementById('resultSplit').innerHTML = '';
      
    } else if(record.type === 'arrivalCalc' && record.params){
      let p = record.params;
      document.getElementById('itemName').value = p.itemName || '';
      document.getElementById('batchNo').value = p.batchNo || '';
      document.getElementById('totalWeight').value = p.totalWeight || '';
      document.getElementById('manufacturer').value = p.manufacturer || '';
      document.getElementById('boxWeight').value = p.boxWeight || '';
      document.getElementById('boxesPerPallet').value = p.boxesPerPallet || '';
      
      document.querySelector('[data-target="arrivalCalc"]').click();
      document.getElementById('resultArrival').innerHTML = '';
    }
  }

  function exportCSV(){
    let history = getHistory();
    if(history.length === 0){
      alert('暂无记录可导出');
      return;
    }
    
    let typeNames = { outStock: '出库', splitCalc: '拆零', arrivalCalc: '到货' };
    let BOM = '\uFEFF';
    let csv = BOM + '时间,类型,客户,标签,备注\n';
    
    history.forEach(h => {
      let summary = h.result.replace(/<[^>]+>/g, '').replace(/\n/g, ' ').substring(0, 100);
      let row = [
        h.time,
        typeNames[h.type] || h.type,
        h.customer || '',
        (h.tags || []).join(';'),
        (h.note || '').replace(/"/g, '""')
      ];
      csv += '"' + row.join('","') + '"\n';
    });
    
    let blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = `原料计算记录_${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }
</script>
</body>
</html>
