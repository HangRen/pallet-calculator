<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>算法测试</title>
</head>
<body>
  <h1>算法测试 - 您的示例</h1>
  <h2>参数：</h2>
  <ul>
    <li>每箱：10kg</li>
    <li>整托：770kg</li>
    <li>零托：60kg, 440kg</li>
    <li>需求：3200kg</li>
  </ul>
  
  <h2>计算结果：</h2>
  <div id="result"></div>

  <script>
    // 生成所有零托子集（保留索引信息）
    function getZeroSubsets(zeroList) {
      let subsets = [];
      let n = zeroList.length;
      for (let mask = 0; mask < (1 << n); mask++) {
        let sum = 0;
        let indices = [];
        for (let i = 0; i < n; i++) {
          if (mask & (1 << i)) {
            sum += zeroList[i];
            indices.push(i);
          }
        }
        subsets.push({ sum, indices });
      }
      return subsets;
    }

    // 计算最优解 - 分别考虑拆分和不拆分两种策略
    function findOptimalSolution(still, zeroList, perT, pBox) {
      let validZeros = zeroList.filter(z => z > 0);
      let subsets = getZeroSubsets(validZeros);
      
      let splitSolutions = []; // 可以拆分的方案
      let noSplitSolutions = []; // 不拆分的方案
      
      // 对于每个零托子集
      subsets.forEach(subset => {
        let zeroSum = subset.sum;
        
        // 情况1：仅用零托（两种策略都适用）
        if (zeroSum > 0 && zeroSum >= still) {
          let sol = {
            zeroSum,
            zeroIndices: subset.indices,
            fullPallets: 0,
            splitPallet: 0,
            total: zeroSum,
            diff: zeroSum - still,
            strategy: 'both'
          };
          splitSolutions.push(sol);
          noSplitSolutions.push(sol);
        }
        
        // 考虑所有可能的整托数量（从0到合理的上限）
        let maxFull = Math.ceil((still + perT * 2) / perT);
        for (let fullNum = 0; fullNum <= maxFull; fullNum++) {
          let totalNoSplit = zeroSum + fullNum * perT;
          
          // 不拆分策略：直接给，多给但最少
          if (totalNoSplit >= still) {
            noSplitSolutions.push({
              zeroSum,
              zeroIndices: subset.indices,
              fullPallets: fullNum,
              splitPallet: 0,
              total: totalNoSplit,
              diff: totalNoSplit - still,
              strategy: 'no-split'
            });
          }
          
          // 拆分策略：可以拆分
          let remainingAfterFull = still - (zeroSum + fullNum * perT);
          if (remainingAfterFull > 0) {
            let needBoxes = Math.ceil(remainingAfterFull / pBox);
            let splitGive = needBoxes * pBox;
            if (splitGive <= perT) {
              let totalWithSplit = zeroSum + fullNum * perT + splitGive;
              splitSolutions.push({
                zeroSum,
                zeroIndices: subset.indices,
                fullPallets: fullNum,
                splitPallet: splitGive,
                total: totalWithSplit,
                diff: totalWithSplit - still,
                strategy: 'split'
              });
            }
          } else {
            // 零托 + 整托已经够了（不拆分）
            let total = zeroSum + fullNum * perT;
            if (total >= still) {
              splitSolutions.push({
                zeroSum,
                zeroIndices: subset.indices,
                fullPallets: fullNum,
                splitPallet: 0,
                total: total,
                diff: total - still,
                strategy: 'split'
              });
            }
          }
        }
      });
      
      // 对两种策略分别排序
      function sortSolutions(solutions) {
        return solutions.sort((a, b) => {
          // 首先按差异排序（正好满足优先于少给）
          if (a.diff !== b.diff) return a.diff - b.diff;
          // 差异相同，优先选择使用零托最多的
          if (a.zeroSum !== b.zeroSum) {
            return b.zeroSum - a.zeroSum;
          }
          // 零托使用相同，优先选择整托数少的
          if (a.fullPallets !== b.fullPallets) return a.fullPallets - b.fullPallets;
          // 最后按总重量
          return a.total - b.total;
        });
      }
      
      splitSolutions = sortSolutions(splitSolutions);
      noSplitSolutions = sortSolutions(noSplitSolutions);
      
      // 去重函数
      function deduplicate(solutions) {
        let seen = new Set();
        let unique = [];
        for (let sol of solutions) {
          let key = `${sol.zeroSum}-${sol.fullPallets}-${sol.splitPallet}`;
          if (!seen.has(key)) {
            seen.add(key);
            unique.push(sol);
          }
          if (unique.length >= 2) break; // 每个策略保留前2个
        }
        return unique;
      }
      
      let bestSplit = deduplicate(splitSolutions);
      let bestNoSplit = deduplicate(noSplitSolutions);
      
      // 合并结果，给每个方案标记策略
      return {
        split: bestSplit,
        noSplit: bestNoSplit
      };
    }

    // 测试
    let pBox = 10;
    let still = 3200;
    let perT = 770;
    let zeroList = [60, 440];

    let { split: splitSolutions, noSplit: noSplitSolutions } = findOptimalSolution(still, zeroList, perT, pBox);
    let validZeros = zeroList.filter(z => z > 0);

    let html = '';
    
    // 渲染单个方案的函数
    function renderSolution(sol, title, borderColor) {
      let result = `<div style="border: 2px solid ${borderColor}; padding: 10px; margin: 10px 0;">`;
      result += `<h3>${title}</h3>`;
      
      if (sol.zeroSum > 0) {
        let zeroVals = sol.zeroIndices.map(i => validZeros[i]);
        result += `<p>🔵 零托：${zeroVals.join(' + ')} = ${sol.zeroSum}kg</p>`;
      }
      
      if (sol.fullPallets > 0) {
        result += `<p>🟢 整托：${sol.fullPallets} 托 × ${perT}kg = ${sol.fullPallets * perT}kg</p>`;
      }
      
      if (sol.splitPallet > 0) {
        let giveBoxes = sol.splitPallet / pBox;
        let remainKg = perT - sol.splitPallet;
        result += `<p>🟠 拆分：给 ${sol.splitPallet}kg（${giveBoxes}箱），留 ${remainKg}kg</p>`;
      }
      
      let diffDesc = '';
      if (sol.total > still) {
        diffDesc = `多 ${sol.total - still}kg`;
      } else if (sol.total === still) {
        diffDesc = '刚好！';
      }
      
      result += `<p><strong>总计：${sol.total}kg | 差异：${diffDesc}</strong></p>`;
      result += `</div>`;
      return result;
    }
    
    // 显示不拆分方案
    html += `<h3 style="margin-bottom:10px;">📦 不拆分方案 - 直接全部出库，不拆托</h3>`;
    if (noSplitSolutions.length > 0) {
      noSplitSolutions.forEach((sol, idx) => {
        html += renderSolution(sol, idx === 0 ? '⭐ 最优（不拆分）' : `方案 ${idx + 1}（不拆分）`, idx === 0 ? 'green' : 'blue');
      });
    } else {
      html += `<div style="border: 2px solid gray; padding: 10px; margin: 10px 0;">暂无合适的不拆分方案</div>`;
    }
    
    // 显示拆分方案
    html += `<h3 style="margin-bottom:10px;margin-top:20px;">✂️  可拆分方案 - 可以拆托，只给需要的部分</h3>`;
    if (splitSolutions.length > 0) {
      splitSolutions.forEach((sol, idx) => {
        html += renderSolution(sol, idx === 0 ? '⭐ 最优（可拆分）' : `方案 ${idx + 1}（可拆分）`, idx === 0 ? 'purple' : 'orange');
      });
    } else {
      html += `<div style="border: 2px solid gray; padding: 10px; margin: 10px 0;">暂无合适的可拆分方案</div>`;
    }

    document.getElementById('result').innerHTML = html;
  </script>
</body>
</html>
