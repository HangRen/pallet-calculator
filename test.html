<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>算法测试 - 三种最佳方案</title>
</head>
<body>
  <h1>算法测试 - 您的示例</h1>
  <h2>参数：</h2>
  <ul>
    <li>每箱：10kg</li>
    <li>整托：770kg</li>
    <li>零托：60kg, 440kg</li>
    <li>需求：3200kg</li>
  </ul>
  
  <h2>计算结果：</h2>
  <div id="result"></div>

  <script>
    // 生成所有零托子集（保留索引信息）
    function getZeroSubsets(zeroList) {
      let subsets = [];
      let n = zeroList.length;
      for (let mask = 0; mask < (1 << n); mask++) {
        let sum = 0;
        let indices = [];
        for (let i = 0; i < n; i++) {
          if (mask & (1 << i)) {
            sum += zeroList[i];
            indices.push(i);
          }
        }
        subsets.push({ sum, indices });
      }
      return subsets;
    }

    // 计算三种最佳方案
    function findOptimalSolution(still, zeroList, perT, pBox) {
      let validZeros = zeroList.filter(z => z > 0);
      let subsets = getZeroSubsets(validZeros);
      
      // 方案1：不拆分方案 - 直接给，多给最少
      let noSplitSolutions = [];
      // 方案2：拆分方案 - 拆分最少
      let splitSolutions = [];
      // 方案3：优先消耗零托方案 - 先用所有零托，再计算拆分
      let useAllZeroSolutions = [];
      
      // 对于每个零托子集
      subsets.forEach(subset => {
        let zeroSum = subset.sum;
        let zeroIndices = subset.indices;
        
        // 方案1：不拆分 - 尝试所有可能的整托数量
        let maxFull = Math.ceil((still + perT * 2) / perT);
        for (let fullNum = 0; fullNum <= maxFull; fullNum++) {
          let total = zeroSum + fullNum * perT;
          if (total >= still) {
            noSplitSolutions.push({
              zeroSum,
              zeroIndices,
              fullPallets: fullNum,
              splitPallet: 0,
              total,
              diff: total - still
            });
          }
        }
        
        // 方案2：拆分 - 尝试所有可能的整托数量
        for (let fullNum = 0; fullNum <= maxFull; fullNum++) {
          let remainingAfterFull = still - (zeroSum + fullNum * perT);
          
          if (remainingAfterFull > 0) {
            let needBoxes = Math.ceil(remainingAfterFull / pBox);
            let splitGive = needBoxes * pBox;
            if (splitGive <= perT) {
              let totalWithSplit = zeroSum + fullNum * perT + splitGive;
              splitSolutions.push({
                zeroSum,
                zeroIndices,
                fullPallets: fullNum,
                splitPallet: splitGive,
                total: totalWithSplit,
                diff: totalWithSplit - still
              });
            }
          } else {
            // 刚好够，不拆分
            let total = zeroSum + fullNum * perT;
            if (total >= still) {
              splitSolutions.push({
                zeroSum,
                zeroIndices,
                fullPallets: fullNum,
                splitPallet: 0,
                total,
                diff: total - still
              });
            }
          }
        }
        
        // 方案3：优先使用所有零托
        // 这里假设 zeroIndices 包含所有零托
        if (zeroIndices.length === validZeros.length && zeroSum > 0) {
          let remaining = still - zeroSum;
          if (remaining > 0) {
            let fullNum = Math.floor(remaining / perT);
            let needAfterFull = remaining - fullNum * perT;
            
            if (needAfterFull > 0) {
              let needBoxes = Math.ceil(needAfterFull / pBox);
              let splitGive = needBoxes * pBox;
              if (splitGive <= perT) {
                let total = zeroSum + fullNum * perT + splitGive;
                useAllZeroSolutions.push({
                  zeroSum,
                  zeroIndices,
                  fullPallets: fullNum,
                  splitPallet: splitGive,
                  total,
                  diff: total - still
                });
              }
            } else {
              // 刚好够
              let total = zeroSum + fullNum * perT;
              useAllZeroSolutions.push({
                zeroSum,
                zeroIndices,
                fullPallets: fullNum,
                splitPallet: 0,
                total,
                diff: total - still
              });
            }
          } else if (zeroSum >= still) {
            // 仅用零托就够了
            useAllZeroSolutions.push({
              zeroSum,
              zeroIndices,
              fullPallets: 0,
              splitPallet: 0,
              total: zeroSum,
              diff: zeroSum - still
            });
          }
        }
      });
      
      // 排序方案1：不拆分，多给最少
      noSplitSolutions.sort((a, b) => {
        if (a.diff !== b.diff) return a.diff - b.diff;
        if (a.fullPallets !== b.fullPallets) return a.fullPallets - b.fullPallets;
        return a.total - b.total;
      });
      
      // 排序方案2：拆分，拆分最少
      splitSolutions.sort((a, b) => {
        // 首先差异最小（正好优先）
        if (a.diff !== b.diff) return a.diff - b.diff;
        // 拆分数量相同，优先选择使用零托最多的
        if (a.splitPallet !== b.splitPallet) return a.splitPallet - b.splitPallet;
        if (a.zeroSum !== b.zeroSum) return b.zeroSum - a.zeroSum;
        return a.total - b.total;
      });
      
      // 排序方案3：优先使用零托
      useAllZeroSolutions.sort((a, b) => {
        if (a.diff !== b.diff) return a.diff - b.diff;
        if (a.splitPallet !== b.splitPallet) return a.splitPallet - b.splitPallet;
        return a.total - b.total;
      });
      
      // 去重并取最佳
      function getBest(solutions, count = 1) {
        let seen = new Set();
        let result = [];
        for (let sol of solutions) {
          let key = `${sol.zeroSum}-${sol.fullPallets}-${sol.splitPallet}`;
          if (!seen.has(key)) {
            seen.add(key);
            result.push(sol);
          }
          if (result.length >= count) break;
        }
        return result;
      }
      
      return {
        noSplit: getBest(noSplitSolutions, 1)[0] || null,
        split: getBest(splitSolutions, 1)[0] || null,
        useAllZero: getBest(useAllZeroSolutions, 1)[0] || null
      };
    }

    // 测试
    let pBox = 10;
    let still = 3200;
    let perT = 770;
    let zeroList = [60, 440];

    let { noSplit, split, useAllZero } = findOptimalSolution(still, zeroList, perT, pBox);
    let validZeros = zeroList.filter(z => z > 0);

    let html = '';
    
    // 渲染单个方案的函数
    function renderSolution(sol, title, borderColor) {
      if (!sol) return `<div style="border: 2px solid gray; padding: 10px; margin: 10px 0;">${title}: 暂无合适方案</div>`;
      
      let result = `<div style="border: 2px solid ${borderColor}; padding: 10px; margin: 10px 0;">`;
      result += `<h3>${title}</h3>`;
      
      if (sol.zeroSum > 0) {
        let zeroVals = sol.zeroIndices.map(i => validZeros[i]);
        result += `<p>🔵 零托：${zeroVals.join(' + ')} = ${sol.zeroSum}kg</p>`;
      }
      
      if (sol.fullPallets > 0) {
        result += `<p>🟢 整托：${sol.fullPallets} 托 × ${perT}kg = ${sol.fullPallets * perT}kg</p>`;
      }
      
      if (sol.splitPallet > 0) {
        let giveBoxes = sol.splitPallet / pBox;
        let remainKg = perT - sol.splitPallet;
        result += `<p>🟠 拆分：给 ${sol.splitPallet}kg（${giveBoxes}箱），留 ${remainKg}kg</p>`;
      }
      
      let diffDesc = '';
      if (sol.total > still) {
        diffDesc = `多 ${sol.total - still}kg`;
      } else if (sol.total === still) {
        diffDesc = '刚好！';
      }
      
      result += `<p><strong>总计：${sol.total}kg | 差异：${diffDesc}</strong></p>`;
      result += `</div>`;
      return result;
    }
    
    // 显示三种最佳方案
    html += renderSolution(noSplit, '📦 方案一：不拆分（多给最少）', 'green');
    html += renderSolution(split, '✂️ 方案二：拆分（拆分最少）', 'purple');
    html += renderSolution(useAllZero, '🔵 方案三：优先消耗零托（先用所有零托）', 'blue');

    document.getElementById('result').innerHTML = html;
  </script>
</body>
</html>
